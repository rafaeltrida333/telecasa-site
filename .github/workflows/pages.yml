name: Publicar site

# Gera o site a cada mudança na main (inclusive as que o CRM grava) e publica no ramo gh-pages,
# que o GitHub Pages serve.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: python build.py
      - name: Publicar no ramo gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publica o site (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
